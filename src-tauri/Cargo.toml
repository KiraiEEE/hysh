[package]
name = "hysh"
version = "0.1.0"
description = "Hysh - a lightweight all-in-one music player for Windows"
authors = ["KiraiEEE <https://kiraieee.github.io/>"]
homepage = "https://kiraieee.github.io/"
license = "GPL-3.0-or-later"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "fs", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "charset", "http2"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
futures-util = "0.3"
lofty = "0.22"
walkdir = "2"
rayon = "1"
md5 = "0.7"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
regex = "1"
dirs = "6"

[target.'cfg(windows)'.dependencies]
# same versions Tauri already links, so nothing extra is compiled in
webview2-com = "0.39"
windows-core = "0.62"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
